name: Radiator heat pump
products:
  - id: 02ek8thasvo40fmd
    manufacturer: Deakon
    model: EVI A2pro
entities:
  - entity: climate
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
            hidden: true
          - dps_val: true
            constraint: mode
            conditions:
              - dps_val: hot
                value: heat
                hidden: true
              - dps_val: cold
                value: cool
                hidden: true
              - dps_val: hotwater
                value: "off"
              - dps_val: hot_hotwater
                value: heat
              - dps_val: cold_hotwater
                value: cool
      - id: 2
        type: integer
        name: temperature
        unit: C
        range:
          min: 7
          max: 60
      - id: 3
        type: integer
        name: current_temperature
      - id: 4
        type: string
        name: mode
        hidden: true
      - id: 103
        type: string
        name: hvac_action
        mapping:
          - dps_val: "off"
            value: idle
          - dps_val: "on"
            value: heating
            constraint: mode
            conditions:
              - dps_val: cold
                value: cooling
          - dps_val: defrost
            value: defrosting
          - dps_val: antifrozen
            value: heating
      - id: 105
        type: integer
        name: inquire_value
      - id: 109
        type: string
        name: error_code_table
      - id: 110
        type: string
        name: error_code_table2
      - id: 111
        type: string
        name: driver_error_code1
      - id: 112
        type: string
        name: driver_error_code2
      - id: 113
        type: string
        name: sen_sys_error_code1
      - id: 114
        type: string
        name: sen_sys_error_code2
  - entity: select
    name: Combined mode
    icon: "mdi:heat-pump"
    category: config
    dps:
      - id: 4
        type: string
        name: option
        mapping:
          - dps_val: hot
            value: Heating only
          - dps_val: cold
            value: Cooling only
          - dps_val: hotwater
            value: Hot water only
          - dps_val: hot_hotwater
            value: Hot water + heating
          - dps_val: cold_hotwater
            value: Hot water + cooling
  - entity: select
    name: Temperature target
    category: config
    dps:
      - id: 5
        type: string
        name: option
        mapping:
          - dps_val: HotWater
            value: Hot water
            icon: "mdi:water-thermometer"
          - dps_val: Hot
            value: Heating
            icon: "mdi:home-thermometer"
          - dps_val: Cooling
            value: Cooling
            icon: "mdi:snowflake-thermometer"
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 13
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 13
        type: bitfield
        name: fault_code
  - entity: binary_sensor
    translation_key: defrost
    category: diagnostic
    dps:
      - id: 103
        type: string
        name: sensor
        mapping:
          - dps_val: defrost
            value: true
          - value: false
  - entity: binary_sensor
    name: Anti-freeze
    class: cold
    category: diagnostic
    dps:
      - id: 103
        type: string
        name: sensor
        mapping:
          - dps_val: antifrozen
            value: true
          - value: false
  - entity: select
    name: Inquire_ID
    category: config
    dps:
      - id: 104
        type: string
        name: option
        mapping:
          - dps_val: "1"
            value: version no.
          - dps_val: "2"
            value: ambient temp.
          - dps_val: "3"
            value: water tank temp.
          - dps_val: "4"
            value: outlet water temp.
          - dps_val: "5"
            value: inlet water temp.
          - dps_val: "6"
            value: evaporator coil temp.
          - dps_val: "7"
            value: exhaust gas temp.
          - dps_val: "8"
            value: condenser coil temp. (after throttling)
          - dps_val: "9"
            value: suction temp.
          - dps_val: "10"
            value: module temp.
          - dps_val: "11"
            value: main valve opening degrees
          - dps_val: "12"
            value: auxiliary valve opening degrees
          - dps_val: "13"
            value: exhaust gas valve opening degrees
          - dps_val: "14"
            value: Fan speed
          - dps_val: "15"
            value: running frequency
          - dps_val: "16"
            value: AC voltage
          - dps_val: "17"
            value: DC voltage
          - dps_val: "18"
            value: current of whole unit
          - dps_val: "19"
            value: compressor current
          - dps_val: "20"
            value: output power
          - dps_val: "21"
            value: EVI plate heat exchanger inlet sensor
          - dps_val: "22"
            value: EVI plate heat exchanger outlet sensor
          - dps_val: "23"
            value: low pressure
          - dps_val: "24"
            value: high pressure
          - dps_val: "25"
            value: error code
          - dps_val: "26"
            value: limited frequency code
          - dps_val: "27"
            value: LCD Controller version
          - dps_val: "28"
            value: MCU1 version
          - dps_val: "29"
            value: MCU2 version
          - dps_val: "30"
            value: MCU3 version
          - dps_val: "31"
            value: Error History
  # DP105: expose the raw diagnostic response for change tracking.
  # The climate.inquire_value attribute remains available for existing scanners.
  - entity: sensor
    name: Diagnostic raw C105
    category: diagnostic
    icon: mdi:database-clock
    dps:
      - id: 105
        type: integer
        name: sensor
  - entity: select
    name: Set_ID
    category: config
    dps:
      - id: 106
        # DP106 selects parameter, DP107 writes a value. Device protocol is multiplexed.
        type: string
        name: option
        mapping:
          - dps_val: "d01"
            value: Heating Temp Setting
          - dps_val: "d02"
            value: Heating Water Tank Temp Setting
          - dps_val: "d03"
            value: Cooling Temp Setting
          - dps_val: "d04"
            value: Restart Temp Difference
          - dps_val: "d05"
            value: Selection on Control basis
          - dps_val: "d06"
            value: Setting Temp Of Electric Heater
          - dps_val: "d07"
            value: Deviation Time of Electric Heater Start
          - dps_val: "d08"
            value: Evaporator coil Temp to enter into defrosting
          - dps_val: "d09"
            value: Evaporator coil Temp to exit defrosting
          - dps_val: "d10"
            value: Defrosting Cycle Period
          - dps_val: "d11"
            value: Defrosting Time
          - dps_val: "d12"
            value: Selection on Control after temp is reached
          - dps_val: "d13"
            value: Ambient temp for Stopping and Starting machine
          - dps_val: "d14"
            value: Temp Difference of Inlet and Outlet water for heat pump's
          - dps_val: "d15"
            value: Working Way of Water Pump
  # DP107: signed values support negative D08 temperatures and configurable D10 intervals.
  # DP107 is multiplexed: select the parameter using DP106 before writing.
  - entity: number
    name: Parameter value
    category: config
    icon: mdi:database-edit
    mode: box
    dps:
      - id: 107
        type: integer
        name: value
        range:
          min: -100
          max: 999
